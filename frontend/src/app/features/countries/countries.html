<app-filters (regionChange)="regionFiltered($event)" />

@switch (status()) {
  @case ('loading') {
    <div class="loading-page countries">
      <p>Loading Countries</p>
    </div>
  }
  @case ('success') {
    <div>
      <ul class="success-page countries">
        @for (country of countries(); track country.id) {
          <app-country-card [country]="country" [origin]="'countries'" />
        }
      </ul>
    </div>
  }
  @case ('error') {
    <div class="error-page countries">
      <p>Not possible to load countries. Try again later.</p>
    </div>
  }
}
