@switch (status()) {
  @case ('loading') {
    <p>Loading Backgrounds</p>
  }
  @case ('sucess') {
    @switch (origin()) {
      @case ('countries') {
        <button
          class="all-card countries"
          (click)="countrySelected(country().id)"
          [style.background-image]="'url(' + backgroundImage() + ')'"
        >
          <header class="card-title">
            <h2>{{ country().alpha3code }}</h2>
            <h1>{{ country().name }}</h1>
          </header>
          <div class="card-content"></div>
          <footer class="country-info">
            <img
              [src]="'https://flagcdn.com/w80/' + country().alpha2code + '.png'"
              [alt]="'Bandeira de ' + country().name"
            />
            <div>
              <p>Capital: {{ country().capital }}</p>
              <p>Region: {{ country().region }}</p>
            </div>

            <div class="image-rights">
              <p>Image info · Author · Rights</p>
            </div>
          </footer>
        </button>
      }
      @case ('popular') {
        <button
          class="all-card popular"
          (click)="countrySelected(country().id)"
          [style.background-image]="'url(' + backgroundImage() + ')'"
        >
          <header class="card-title">
            <h2>{{ country().alpha3code }}</h2>
            <h1>{{ country().name }}</h1>
          </header>
          <div class="card-content"></div>
          <footer class="country-info">
            <img
              [src]="'https://flagcdn.com/w80/' + country().alpha2code + '.png'"
              [alt]="'Bandeira de ' + country().name"
            />
            <div>
              <p>Capital: {{ country().capital }}</p>
              <p>Region: {{ country().region }}</p>
            </div>

            <div class="image-rights">
              <p>Image info · Author · Rights</p>
            </div>
          </footer>
        </button>
      }
    }
  }
  @case ('error') {
    <p>Error loading countries backgrounds</p>
  }
}
